name: change-verify

# 证据闸门的 CI 形态：未封印/失效/失败的 change 直接变红。
# 要让它真的拦住合并，还需在仓库设置里把 change-check 设为 required status check
# （fork 或私有仓无法用代码表达这一步）。
#
# 只在 PR 上跑：封印绑定的是分支上那一版代码，合并到 main 的 merge commit 会
# 改动工作树，证据因此判失效——那是合并动作的噪音，不是代码变了。要挡的是
# 合并前的 PR head。
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: change-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 是必需的：证据失效判定要比较"封印时的 commit"与当前
      # HEAD 之间的改动集合，浅克隆里那个 commit 不可解析，合法的封印会假红。
      # PR 默认检 merge ref；显式检 head sha，让 check 看到的就是被评审的那一版。
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 这个仓库用不用 spec/changes
        id: scope
        run: |
          if [ -d spec/changes ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "没有 spec/changes/——跳过（还没用 change 流程）"
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: steps.scope.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache: true

      # 这一行假设 forge 就在本仓库里（Dogfood 形态）。别的仓库要接这道闸门，
      # 改成安装一个固定版本的 forge，而不是 go build 本仓的 cmd/forge。
      - name: 构建 forge
        if: steps.scope.outputs.run == 'true'
        run: go build -o "$RUNNER_TEMP/forge" ./cmd/forge

      - name: 证据闸门
        if: steps.scope.outputs.run == 'true'
        run: "$RUNNER_TEMP/forge change check"