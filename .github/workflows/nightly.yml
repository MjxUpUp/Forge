name: Nightly

on:
  schedule:
    # off-minute：避开整点/半点的 Actions + registry 洪峰（队列延迟最小）。
    - cron: "37 3 * * *"
  workflow_dispatch:

# 最小权限：只读代码。
permissions:
  contents: read

jobs:
  # 全量回归 + 能力面闭合 + 发布物行为冒烟：每日在 fresh runner 上跑一次
  # PR CI 覆盖不到的面（文档漂移、测试账本、临时仓库里的 change→verify→归档）。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go build -o /tmp/forge ./cmd/forge/
      # 全量单元/集成（PR CI 走平台矩阵，nightly 再跑一次全量，防时序相关回归）。
      - run: go test ./... -count=1
      # 能力面闭合：命令树与活文档的漂移（core-only 之后是主要回归面）。
      - run: /tmp/forge docs closure --strict
      # 测试账本：执行记录与真实测试的偏差（phantom/orphaned）。
      - run: /tmp/forge test ledger
      # 发布物行为级冒烟（1.88 激进减法删除了 artifact-drill）：在临时仓库里用
      # 构建出的二进制真实建 change→verify→change check。本仓库 change 全归档时
      # `forge change check` 会空跑成功退出 0，不能替代这一步。
      - run: sh scripts/checks/release-smoke.sh /tmp/forge
