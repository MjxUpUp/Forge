name: Release Please

# release-please 层：接管「何时发版、发什么版本」——扫 Conventional Commits、维护
# Release PR（版本 bump + changelog）、合并后自动打 v* tag 并建 GitHub Release；
# 构建发布层 release.yml（test→goreleaser→npm）零改动，由下方 dispatch 步串联。
# 两层分工与发版纪律见仓库根 RELEASE.md。
# Release PR 经 automerge 步注册 auto-merge（PAT 路径），检查绿后自动合并——
# feat/fix 合 main 起全链（tag→构建→npm→装回验证）无人值守。
on:
  push:
    branches: [main]

permissions:
  contents: write # Release PR 分支提交 + tag + GitHub Release
  pull-requests: write # 创建/维护 Release PR（autorelease 标签）
  actions: write # GITHUB_TOKEN 路径下 dispatch release.yml（在新 tag 上跑构建层）

# 串行化：快速连续合 PR 时，两个 run 并发 force-push 同一
# release-please--branches--main 分支会互相踩（瞬时红 run / 分支更新丢失）。
# 排队不取消——cancel 会截断进行中的发版动作。
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHA pin v5.0.0——浮动 major tag 可被上游重指向，与 release.yml 的 action pin
      # 同一供应链姿势。
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # manifest 模式为默认：自动读 release-please-config.json +
          # .release-please-manifest.json，无需 release-type/command 输入。
          #
          # token 双路径：默认 GITHUB_TOKEN（零配置即可用）；配置 secret
          # RELEASE_PLEASE_TOKEN（PAT）后升级——Release PR 上能跑 CI 检查、tag push
          # 事件直接触发 release.yml。GITHUB_TOKEN 产生的 tag push/PR 事件不会触发
          # 新 workflow run（GitHub 防递归的文档化行为），故默认路径须靠下方 dispatch。
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - name: Auto-merge Release PR
        # 全自动发版最后一环：Release PR 开出/刷新后注册 auto-merge（幂等——已注册的
        # PR 重复注册是 no-op）——6 个必需检查（ci.yml 的 build×3 + skills-qa +
        # scripts-test×2）在 release-please 分支跑绿后，GitHub 自动 squash 合并；
        # 随后 PAT 的 push.main 触发本 workflow 建 tag、PAT 的 tag push 直接触发
        # release.yml——feat/fix 合 main 起零人工。
        #
        # 仅 PAT 路径启用：GITHUB_TOKEN 注册的 auto-merge，其合并 push 由 GITHUB_TOKEN
        # 产生、按防递归规则不触发 push.main workflow——建 tag 的 release-please run
        # 永远不来（要等下一次人工 push 才补），发版止步于 Release PR 合并。PAT 合并
        # 则全链正常触发。repo 前置：Settings → General → Pull Requests → Allow
        # auto-merge 须开启（已开；关掉则本步失败红 run——刻意的漂移信号，不静默吞）。
        # PAT 检测在 run 脚本读 env：if: 引用 secrets 被 GitHub 静态拒绝（见
        # TestReleasePleaseWorkflow_NoSecretsInIf 与 2026-08-19 首跑事故注释）。
        if: ${{ steps.release.outputs.prs != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          PRS: ${{ steps.release.outputs.prs }}
          PAT: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "RELEASE_PLEASE_TOKEN 未配置——GITHUB_TOKEN auto-merge 的合并 push 不触发建 tag run，保持人工合并路径"
            exit 0
          fi
          # prs 输出是 PullRequest 对象 JSON 数组（release-please src/pull-request.ts，
          # PR 号字段 number）；单包发版取首项。--repo 显式给：本 workflow 不 checkout
          # （无 .git），gh 缺 --repo 会 fatal: not a git repository（与 dispatch 步
          # v1.38.0 首发事故同坑）。
          pr=$(echo "$PRS" | jq -r '.[0].number')
          echo "enabling auto-merge on Release PR #$pr"
          gh pr merge --auto --squash "$pr" --repo "$GITHUB_REPOSITORY"
      - name: Dispatch Release workflow on the new tag
        # GITHUB_TOKEN 路径的串联步骤：release-please 合并 Release PR 后自动打了 v* tag
        # 并建 GitHub Release，但该事件由 GITHUB_TOKEN 产生、不触发 release.yml——用
        # workflow_dispatch 显式调度（GITHUB_TOKEN 可触发 dispatch 的文档化例外）。
        #
        # 坑（2026-08-19 首跑事故，scratch 分支二分定位）：PAT 双跑防护不能写进 if:
        # 表达式——secrets 上下文不在 steps.if 白名单，GitHub 静态校验直接拒绝整个
        # workflow 文件（run 记录 0s 失败、0 jobs、无日志）。检测必须下沉到 run 脚本
        # 读 env（env 里引用 secrets 合法）。
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
          # PAT 路径下 tag push 事件由 PAT 产生、会直接触发 release.yml，此步让位防双跑。
          PAT: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -n "$PAT" ]; then
            echo "RELEASE_PLEASE_TOKEN configured - tag push triggers release.yml directly, skipping dispatch"
            exit 0
          fi
          echo "release-please created $TAG; dispatching Release workflow on it"
          # --repo 必须显式给：本 workflow 不 checkout（无 .git），gh 无 --repo 时会
          # 尝试从当前 git 仓库推断而 fatal: not a git repository（v1.38.0 首发事故）。
          gh workflow run release.yml --ref "$TAG" --repo "$GITHUB_REPOSITORY"
