name: Release

on:
  push:
    tags:
      - "v*"
  # release-please.yml 的 GITHUB_TOKEN 路径经 workflow_dispatch 调度本 workflow：
  # GITHUB_TOKEN 产生的 tag push 事件不触发新 workflow run（GitHub 防递归），dispatch
  # 是文档化例外。仍只在 tag ref 上被调度（--ref v*），无 tag 发不出版。
  workflow_dispatch:

# 顶层最小权限；各 job 按需提权（最小授权原则——id-token 只有签名/溯源两个 job 拿得到）。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test ./... -count=1 -race
      - run: go vet ./...
      # 版本对账门禁放在 needs 链源头：tag 必须等于 npm/package.json 的 version，
      # 不一致 1 分钟内终止整条链（放在 npm job 则 goreleaser 白跑 30min 才拦）。
      # release-please 的 Release PR 保证两者一致（npm/package.json 在 extra-files 里被
      # 同步 bump），此门禁防 RELEASE.md 允许的手动打 tag 路径出错——
      # 没有对账时打错 tag 会发出货不对板的包（二进制是 tag 的，包版本号是 package.json 的）。
      - name: Tag/version consistency gate
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(jq -r .version npm/package.json)
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::tag v$TAG_VER != npm/package.json version $PKG_VER — 先对齐版本号再发版"
            exit 1
          fi

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # 创建 GitHub Release + 上传资产
      id-token: write  # cosign keyless 签名的 OIDC token（GitHub Actions 身份凭证，非 secret）
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # cosign：goreleaser signs 块用 v3 的 --bundle（证书+签名合一的 .sigstore.json）。
      # pin 产物版本 v3.1.3——cosign-installer 默认装 latest，曾因 v2→v3 升级把
      # --output-signature 变空路径致 v1.28.3 发布失败；pin 住已知良好的 v3 bundle 行为，
      # 与下方 syft v1.50.0 同一供应链姿势。升 v4 前须人工验证 flags 兼容。
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # syft：goreleaser sboms 块的外部依赖（goreleaser-action 不自带）。
      # install.sh 按 commit pin（与 actions 的 SHA pin 同一供应链姿势），产物版本 pin v1.50.0。
      - name: Install syft (SBOM generator)
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/16223e6dd7893fe578787658ceb876257483d404/install.sh | sh -s -- -b /usr/local/bin v1.50.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

  npm:
    # Publish @agent_forge/forge + 5 平台子包到 npmjs.org。主包 optionalDependencies
    # 声明平台子包，npm install 按 os/cpu 只装匹配当前平台的一个，二进制随子包发布到
    # registry——不依赖 install script（npm 12 起 install scripts 默认禁用，平台分包是
    # 官方推荐的二进制分发方式，esbuild/rollup/turbo 同模式）。
    #
    # 必须在 goreleaser 之后：从 v<ver> GitHub Release 下载各平台 tar.gz 组装子包 bin/。
    # 架构变化：与旧 install.js 方案不同，npm 包现在自带二进制（不可变），重建 GitHub
    # Release 二进制不再自动更新已发 npm 包——需 bump 版本重发（npm 不允许覆盖）。
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read  # checkout + 下载 Release 资产
      id-token: write  # npm publish --provenance 的 OIDC token
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          # setup-node 写 .npmrc 用 NODE_AUTH_TOKEN 认证该 registry——CI 标准模式，
          # 避免项目级 .npmrc 冲突。
          registry-url: "https://registry.npmjs.org"
      - name: Publish main + platform subpackages (idempotent)
        # 幂等：每个包 npm view 检测已发布则跳过（npm 不允许覆盖已发布版本）。
        # version 从主 package.json 读，用 jq 注入各子包 + 主包 optionalDependencies，
        # 消除多包版本同步风险。子包先发（主包依赖），主包后发。
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # tag↔package.json 版本对账已在 test job（needs 链源头）拦过，此处直接读版本。
          VER=$(node -p "require('./package.json').version")
          echo "Releasing @agent_forge/forge@$VER + 5 platform subpackages"
          # goreleaser archive 命名 forge_<ver>_<os>_<x86_64|aarch64>.tar.gz；
          # npm 子包按 Node process.platform-process.arch 命名（amd64→x64，windows→win32）。
          declare -A ARCH_MAP=(
            [darwin-arm64]=darwin_aarch64
            [darwin-x64]=darwin_x86_64
            [linux-arm64]=linux_aarch64
            [linux-x64]=linux_x86_64
            [win32-x64]=windows_x86_64
          )
          for pkg in "${!ARCH_MAP[@]}"; do
            archive_arch="${ARCH_MAP[$pkg]}"
            url="https://github.com/${{ github.repository }}/releases/download/v${VER}/forge_${VER}_${archive_arch}.tar.gz"
            echo "Fetching $pkg <- $url"
            mkdir -p "platforms/$pkg/bin"
            curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -o /tmp/forge.tar.gz "$url"
            tar xzf /tmp/forge.tar.gz -C "platforms/$pkg/bin"
            # 注入 release 版本（repo 占位被实际版本覆盖，消除同步风险）
            tmp=$(mktemp)
            jq --arg v "$VER" '.version = $v' "platforms/$pkg/package.json" > "$tmp" && mv "$tmp" "platforms/$pkg/package.json"
          done
          # dry-run 门禁：真实 publish 前对 6 包跑 npm publish --dry-run，走完整 npm-package-arg
          # 解析 + pack，提前暴露"路径含/被当 github shorthand"类 bug（v1.15.0 npm job 因此 git ls-remote
          # 失败）。dry-run 不上传。"已发布"版本（CI rerun 或部分包手动发布过，npm 查 registry 发现
          # version 存在）不算失败——与下方 publish 块的幂等设计一致；只 npa/结构类错误才 exit 1。
          # 防御性兼容：npm 官方文档称 dry-run 不查 registry，但实测 npm 11.18 + 华为云等镜像
          # registry 的 dry-run 会查并报 cannot-publish-over，版本/registry 行为不一，故识别此错为
          # 结构通过（非死代码——本地 npm 11.18 复现过主包 1.15.1 dry-run 报此错）。
          # 本地预演见 scripts/release-rehearsal.sh。
          for pkg in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            out=$(cd "platforms/$pkg" && npm publish --dry-run --access public 2>&1) \
              || echo "$out" | grep -q "cannot publish over the previously published" \
              || { echo "$out"; exit 1; }
          done
          out=$(npm publish --dry-run --access public 2>&1) \
            || echo "$out" | grep -q "cannot publish over the previously published" \
            || { echo "$out"; exit 1; }
          echo "dry-run gate passed for 6 packages"
          # 先发 5 子包（主包 optionalDependencies 指向它们，必须先就位）。
          # --provenance：用 GitHub Actions OIDC 给包附 Sigstore 溯源声明（npm 官方供应链
          # 加固，公开仓库 + package.json repository 字段匹配即可，无需额外配置）。
          # 只加在真实 publish 上：dry-run 在本地预演（无 OIDC 环境）也要能跑。
          for pkg in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            if npm view "@agent_forge/forge-$pkg@$VER" version >/dev/null 2>&1; then
              echo "already published @agent_forge/forge-$pkg@$VER, skipping"
            else
              # cd 进子包目录再 publish：裸路径 "platforms/$pkg" 含 / 会被 npm-package-arg
              # 解析成 GitHub shorthand（user/platforms repo/$pkg）→ git ls-remote 失败。
              # cd 后无参数 publish cwd，npa 当 folder（esbuild/rollup 同模式）。
              (cd "platforms/$pkg" && npm publish --access public --provenance)
            fi
          done
          # 主包 version + optionalDependencies 各项 version 注入后 publish
          tmp=$(mktemp)
          jq --arg v "$VER" '.version = $v | .optionalDependencies |= with_entries(.value = $v)' package.json > "$tmp" && mv "$tmp" package.json
          if npm view "@agent_forge/forge@$VER" version >/dev/null 2>&1; then
            echo "already published @agent_forge/forge@$VER, skipping"
          else
            npm publish --access public --provenance
          fi
        working-directory: npm

  # 发布后装机验证：补「发布后装机无人验证」缺口——npm job 只保证包发出去，
  # 不保证用户 npm i -g 装回来的二进制能跑、版本对得上 tag（货不对板要发版后
  # 才发现就晚了）。needs 链尾端：test→goreleaser→npm→npm-verify。
  npm-verify:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install from npmjs and assert version == tag
        run: |
          WANT="${GITHUB_REF_NAME#v}"
          npm i -g "@agent_forge/forge@$WANT"
          GOT=$(forge --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::npm 装回的 forge 版本 $GOT != tag $WANT——发布产物货不对板"
            exit 1
          fi
          echo "npm-verify passed: forge $GOT == tag v$WANT"
