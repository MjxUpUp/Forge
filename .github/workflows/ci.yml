name: CI

on:
  # 所有分支推送都跑三平台 CI——跨平台失败（路径分隔符等）必须在合并前暴露，
  # 而不是合并推 main 后才报警。concurrency 组按 ref 去重，同一分支反复 push
  # 自动取消旧 run，不会堆积。
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

# 最小权限：CI 只读代码，不写仓库。显式声明避免吃仓库默认值（默认可能是 write）。
permissions:
  contents: read

# 同一 ref 反复 push 时取消在跑的旧 run，避免排队堆积。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # 25min：windows + -race 下 internal/cli 单包可 >10min、整 job 实测 11~15min+
    # （2026-09-22 实录：#87 压线 14m57s 过、#88 两次撞顶——先撞 go test 包级默认
    # 10min 超时、再撞本处 job 15min 超时）。15min 天花板对 windows 是随机红灯，
    # 抬到 25min 留余量；ubuntu/macos 实际耗时 ~3-5min 不受影响（timeout 是上限
    # 不是耗时）。包级 -timeout 同步抬到 20m（见下方 go test 行）。
    timeout-minutes: 25
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # Go 版本唯一真相源是 go.mod，消除 ci.yml/release.yml 多处硬编码漂移。
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # -timeout 20m：包级默认 10min 被 windows + -race 的 internal/cli 撞穿过
      # （2026-09-22 #88 实录 601s panic），抬到与 job 上限匹配的 20m。
      - run: go test ./... -count=1 -race -timeout 20m
      # gofmt 门禁（仅 ubuntu 跑一份即可，格式化结果与 OS 无关）。
      # 覆盖根 module 全部 .go 目录（cmd/internal/skills，vendor/ 不参与）；
      # 与仓库 .gitattributes 的 eol=lf 配合只报真实格式问题。
      # `! gofmt -l ... | grep .`：违规文件名直接进 CI 日志（test -z 会吞掉输出，失败只见 exit 1）。
      - if: matrix.os == 'ubuntu-latest'
        run: "! gofmt -l cmd internal skills | grep ."
      # 死代码金丝雀（staticcheck + deadcode 双零）：防死代码存量在清扫后悄悄
      # 回流——dead-code-sweep（5dd3ae8）的一次性人工双零固化为常驻门禁。
      # 工具版本与口径的唯一真相源在 Makefile canary 目标（deadcode 必须带
      # -test：测试可达算活代码）。结果与 OS 无关，ubuntu 跑一份即可（gofmt 同例）。
      - if: matrix.os == 'ubuntu-latest'
        run: make canary
      # 阶段 D 守卫（scripts/checks/*.sh）必须真的在 CI 跑：deadcode-zero.sh 曾因
      # `out=$(go run …)` 在 go run 失败时留空而静默假绿（exit 0），脚本内已改为
      # 先看退出码；这里把两条守卫接进常态流水线，避免它们只活在本地。
      - if: matrix.os == 'ubuntu-latest'
        run: sh scripts/checks/deadcode-zero.sh
      - if: matrix.os == 'ubuntu-latest'
        run: sh scripts/checks/no-hook-refs.sh
      # 已删命令/门禁不得在用户可见文本里回流（1.88 激进减法）：守卫自身曾在
      # 默认目标缺失与通配写法下假绿，这里带默认目标集合常态跑，红了要修文案。
      - if: matrix.os == 'ubuntu-latest'
        run: sh scripts/checks/no-removed-checks.sh
      # change 产物数量的文档口径（三份）：旧「五份/四份」说法会让 agent 少填 change.md。
      - if: matrix.os == 'ubuntu-latest'
        run: sh scripts/checks/docs-artifact-counts.sh

  # 发版脚本（scripts/release.js）的 node:test 测试。原来只存在于本地，CI 不跑 = 没测试。
  scripts-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: node --test scripts/release.test.js

  # 技能内容目录门禁：core-only 删掉了 `forge skills` 脚手架，规范校验改由 Go 测试承担
  # （每个目录必须有 SKILL.md、name 与目录同名、description 非空）。
  skills-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # 技能脚手架命令（`forge skills validate/audit`）已随 core-only 删除；
      # 内容目录的规范守卫改由 Go 测试承担：每个技能目录必须有 SKILL.md、
      # frontmatter 的 name 与目录同名、description 非空（internal/compat）。
      - run: go test ./internal/compat -run TestSkillsContentDirs -count=1 -v
