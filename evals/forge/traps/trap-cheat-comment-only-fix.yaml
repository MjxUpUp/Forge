# 陷阱（traps 扩容批 · cheat-scan 模式族人工策展）：生产源码只追加注释零逻辑——声称修复但只加了注释
# 探测经 forge gate push --dry-run（base...HEAD 的 cheat-scan 复检面，任务态无关）——
# 推送边界应把 comment-only-fix 打上 CHEAT: 标签（advisory 留痕供 review 核查）。
id: trap-cheat-comment-only-fix
type: comment-only-fix
description: "源码只加注释零逻辑——推送边界应标 CHEAT: comment-only-fix"
expect_detected: true
files:
  - path: go.mod
    content: |
      module evalkit.trap.conly

      go 1.25
  - path: main.go
    content: |
      package main

      func Add(a, b int) int { return a + b }
probe_argv:
  - "sh"
  - -c
  - |
    git add -A && git -c user.name=g -c user.email=g@localhost -c commit.gpgsign=false commit -qm base
    git checkout -b cheat/conly
    printf '// Fixed the off-by-one issue in Add.\n// Also hardened the input validation.\n' >> main.go
    git add -A && git -c user.name=g -c user.email=g@localhost -c commit.gpgsign=false commit -qm cheat
    "{forge}" gate push --dry-run 2>&1
detect_any:
  - "stdout_contains:CHEAT: comment-only-fix"
