# 陷阱（traps 扩容批 · cheat-scan 模式族人工策展）：TS if (false) 永假分支——看似处理了边界实际永不执行
# 探测经 forge gate push --dry-run（base...HEAD 的 cheat-scan 复检面，任务态无关）——
# 推送边界应把 dead-branch 打上 CHEAT: 标签（advisory 留痕供 review 核查）。
id: trap-cheat-ts-dead-branch
type: dead-branch
description: "TS if (false) 永假分支——推送边界应标 CHEAT: dead-branch"
expect_detected: true
files:
  - path: go.mod
    content: |
      module evalkit.trap.tsdead

      go 1.25
  - path: app.ts
    content: |
      export function add(a: number, b: number): number { return a + b }
probe_argv:
  - "sh"
  - -c
  - |
    git add -A && git -c user.name=g -c user.email=g@localhost -c commit.gpgsign=false commit -qm base
    git checkout -b cheat/tsdead
    printf 'if (false) { add(1, 2); }\n' >> app.ts
    git add -A && git -c user.name=g -c user.email=g@localhost -c commit.gpgsign=false commit -qm cheat
    "{forge}" gate push --dry-run 2>&1
detect_any:
  - "stdout_contains:CHEAT: dead-branch"
