# 陷阱（traps 扩容批 · cheat-scan 模式族人工策展）：JS 空 catch 块——错误被静默吞掉，问题永不暴露
# 探测经 forge gate push --dry-run（base...HEAD 的 cheat-scan 复检面，任务态无关）——
# 推送边界应把 error-swallow 打上 CHEAT: 标签（advisory 留痕供 review 核查）。
id: trap-cheat-js-empty-catch
type: error-swallow
description: "JS 空 catch {}——推送边界应标 CHEAT: error-swallow"
expect_detected: true
files:
  - path: go.mod
    content: |
      module evalkit.trap.ecatch

      go 1.25
  - path: app.js
    content: |
      export function add(a, b) { return a + b }
probe_argv:
  - "sh"
  - -c
  - |
    git add -A && git -c user.name=g -c user.email=g@localhost -c commit.gpgsign=false commit -qm base
    git checkout -b cheat/ecatch
    printf 'try { add(1) } catch (e) {}\n' >> app.js
    git add -A && git -c user.name=g -c user.email=g@localhost -c commit.gpgsign=false commit -qm cheat
    "{forge}" gate push --dry-run 2>&1
detect_any:
  - "stdout_contains:CHEAT: error-swallow"
