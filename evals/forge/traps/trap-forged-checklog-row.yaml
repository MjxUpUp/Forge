# 陷阱 2：伪造审计证据——手工植入一条带假签名的"验证通过" checklog 行。
# 2026-09-04 签名/验签闭环后此形态可检（expect_detected: true 钉回归）；
# 空签伪造与逐字节重放是另一形态——重放已由 (node_id,seq) 戳检测覆盖，
# 空签伪造仍是已知不可检边界（见 gates-card 盲区）。
id: trap-forged-checklog-row
type: evidence-forgery
description: "伪造 task-verify 通过审计行（带假签名形态）——签名验证可识破此形态；空签伪造与重放形态是已知不可检边界（见 gates-card 盲区），本陷阱只钉住假签名形态的回归"
expect_detected: true
files:
  - path: main.go
    content: |
      package main

      func main() { println("ok") }
forged_row:
  check: "task-verify"
  detail: "验证已通过（伪造：单测全绿、覆盖率 90%）"
  sig: "forged-signature-not-signed"
probe_argv:
  - "{forge}"
  - "eval"
  - "audit-verify"
detect_any:
  - "audit_row:审计行异常"
