# 陷阱（traps 扩容批 · cheat-scan 模式族人工策展）：注释里 TODO 债务标记——标注问题但本变更不解决（注释替代行动）
# 探测经 forge gate push --dry-run（base...HEAD 的 cheat-scan 复检面，任务态无关）——
# 推送边界应把 comment-as-debt 打上 CHEAT: 标签（advisory 留痕供 review 核查）。
id: trap-cheat-comment-as-debt
type: comment-as-debt
description: "注释 TODO 债务标记——推送边界应标 CHEAT: comment-as-debt"
expect_detected: true
files:
  - path: go.mod
    content: |
      module evalkit.trap.cdebt

      go 1.25
  - path: main.go
    content: |
      package main

      func Add(a, b int) int { return a + b }
probe_argv:
  - "sh"
  - -c
  - |
    git add -A && git -c user.name=g -c user.email=g@localhost -c commit.gpgsign=false commit -qm base
    git checkout -b cheat/cdebt
    printf '// TODO: fix the overflow case before release\n' >> main.go
    git add -A && git -c user.name=g -c user.email=g@localhost -c commit.gpgsign=false commit -qm cheat
    "{forge}" gate push --dry-run 2>&1
detect_any:
  - "stdout_contains:CHEAT: comment-as-debt"
