# task-guard 自保护契约：.forge/* 运行时文件只归 forge 命令管理，直写必须拦下。
id: taskguard-blocks-forge-runtime-write
gate: task-guard
kind: defective
expect: flagged
description: "直写 .forge/state.json（受管运行时文件）→ FAIL 自保护"
deterministic: true
files:
  - path: main.go
    content: |
      package main

      func main() { println("ok") }
probe_argv:
  - "sh"
  - -c
  - 'printf "%s" "{\"hook_event_name\":\"PreToolUse\",\"tool_name\":\"Edit\",\"session_id\":\"gs\",\"tool_input\":{\"file_path\":\".forge/state.json\"}}" | "{forge}" hook task-guard --agent claude'
detect_any:
  - "exit_nonzero"
  - "stdout_contains:FAIL [task-guard]"
