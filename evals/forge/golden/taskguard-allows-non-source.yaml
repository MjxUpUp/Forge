# 干净样本：非源码扩展（.md）→ 直接放行（技术栈无关的源码判定）。
id: taskguard-allows-non-source
gate: task-guard
kind: clean
expect: clean
description: "写 README.md（非源码扩展）→ 放行"
deterministic: true
files:
  - path: main.go
    content: |
      package main

      func main() { println("ok") }
probe_argv:
  - "sh"
  - -c
  - 'printf "%s" "{\"hook_event_name\":\"PreToolUse\",\"tool_name\":\"Write\",\"session_id\":\"gs\",\"tool_input\":{\"file_path\":\"README.md\"}}" | "{forge}" hook task-guard --agent claude'
detect_any:
  - "exit_nonzero"
  - "stdout_contains:FAIL [task-guard]"
