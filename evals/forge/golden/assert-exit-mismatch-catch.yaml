# 断言族 golden：exit 断言期望不匹配（期望 0 实际 1）→ 判负（fail-closed 方向）。
id: assert-exit-mismatch-catch
gate: verify-acceptance
kind: defective
expect: flagged
description: "exit:0 断言遇退出 1 → BLOCKED 判负（退出码断言不匹配即拦）"
deterministic: true
files:
  - path: go.mod
    content: |
      module evalkit.assert.c4
      go 1.25
  - path: fail.sh
    content: |
      #!/bin/sh
      exit 1
probe_argv:
  - "sh"
  - -c
  - |
    git add -A && git -c user.name=g -c user.email=g@localhost -c commit.gpgsign=false commit -qm init
    "{forge}" task start --ref assert/c4 --accept "sh fail.sh ::" --assert "exit: :: 0" >/dev/null 2>&1 || exit 1
    "{forge}" task verify-acceptance 2>&1
detect_any:
  - "exit_nonzero"
