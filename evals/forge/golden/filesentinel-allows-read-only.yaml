# 干净样本：只读命令（无写标记、无变更）→ 放行。
id: filesentinel-allows-read-only
gate: file-sentinel
kind: clean
expect: clean
description: "Bash 只读命令（ls）→ 无新增变更，放行"
deterministic: true
files:
  - path: main.go
    content: |
      package main

      func main() { println("ok") }
probe_argv:
  - "sh"
  - -c
  - 'pre=$(printf "%s" "{\"hook_event_name\":\"PreToolUse\",\"tool_name\":\"Bash\",\"session_id\":\"gs\",\"tool_input\":{\"command\":\"ls\"}}" | "{forge}" hook bash-guard --agent claude); ls >/dev/null; printf "%s" "{\"hook_event_name\":\"PostToolUse\",\"tool_name\":\"Bash\",\"session_id\":\"gs\",\"tool_input\":{\"command\":\"ls\"}}" | "{forge}" hook file-sentinel --agent claude'
detect_any:
  - "exit_nonzero"
  - "stdout_contains:FAIL [file-sentinel]"
