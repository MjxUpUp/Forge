# 干净样本：forge 命令本身改运行时文件是合法路径（forge-cmd marker → 允许）。
id: filesentinel-allows-forge-command
gate: file-sentinel
kind: clean
expect: clean
description: "Bash 执行 forge status（forge 命令豁免）→ 放行"
deterministic: true
files:
  - path: main.go
    content: |
      package main

      func main() { println("ok") }
probe_argv:
  - "sh"
  - -c
  - 'pre=$(printf "%s" "{\"hook_event_name\":\"PreToolUse\",\"tool_name\":\"Bash\",\"session_id\":\"gs\",\"tool_input\":{\"command\":\"forge status\"}}" | "{forge}" hook bash-guard --agent claude); "{forge}" status >/dev/null 2>&1; printf "%s" "{\"hook_event_name\":\"PostToolUse\",\"tool_name\":\"Bash\",\"session_id\":\"gs\",\"tool_input\":{\"command\":\"forge status\"}}" | "{forge}" hook file-sentinel --agent claude'
detect_any:
  - "exit_nonzero"
  - "stdout_contains:FAIL [file-sentinel]"
  - "stdout_contains:quarantine"
