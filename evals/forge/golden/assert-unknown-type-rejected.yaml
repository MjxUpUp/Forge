# 断言族 golden：声明期门禁——未知断言类型（regex，宪法排除）在 task start 即拒
#（exit 非 0），不等到跑时才发现。
id: assert-unknown-type-rejected
gate: task-start-declaration
kind: defective
expect: flagged
description: "regex 断言（未知类型）→ task start 声明期拒绝 exit 非 0"
deterministic: true
files:
  - path: go.mod
    content: |
      module evalkit.assert.c9
      go 1.25
probe_argv:
  - "sh"
  - -c
  - |
    git add -A && git -c user.name=g -c user.email=g@localhost -c commit.gpgsign=false commit -qm init
    "{forge}" task start --ref assert/c9 --accept "go version ::" --assert "regex:^ok$ :: ok" 2>&1
detect_any:
  - "exit_nonzero"
