# task-guard 自保护契约：.claude/settings* 同为受管面（hooks 接线归 forge 管）。
id: taskguard-blocks-claude-settings-write
gate: task-guard
kind: defective
expect: flagged
description: "直写 .claude/settings.json → FAIL 自保护"
deterministic: true
files:
  - path: main.go
    content: |
      package main

      func main() { println("ok") }
probe_argv:
  - "sh"
  - -c
  - 'printf "%s" "{\"hook_event_name\":\"PreToolUse\",\"tool_name\":\"Edit\",\"session_id\":\"gs\",\"tool_input\":{\"file_path\":\".claude/settings.json\"}}" | "{forge}" hook task-guard --agent claude'
detect_any:
  - "exit_nonzero"
  - "stdout_contains:FAIL [task-guard]"
