# 断言族 golden：file-changed 期待命中但没改（考卷要求改某面而任务零动作）→ 判负。
id: assert-file-changed-miss-catch
gate: verify-acceptance
kind: defective
expect: flagged
description: "file-changed:internal/** 而任务未触碰该面 → BLOCKED 判负"
deterministic: true
files:
  - path: go.mod
    content: |
      module evalkit.assert.c8
      go 1.25
probe_argv:
  - "sh"
  - -c
  - |
    git add -A && git -c user.name=g -c user.email=g@localhost -c commit.gpgsign=false commit -qm init
    "{forge}" task start --ref assert/c8 --accept "go version ::" --assert "file-changed:internal/**" >/dev/null 2>&1 || exit 1
    "{forge}" task verify-acceptance 2>&1
detect_any:
  - "exit_nonzero"
